<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
   FLAMES logo.

   Visual language follows Brandon Runnels' alamo mark (docs/source/alamo3-inv.svg):
   a square "domain" outline holding an abstract block-structured-AMR glyph, set
   next to a lowercase wordmark with a letter-spaced subtitle.

   The FLAMES glyph tells the atomization-and-burn story: a block-structured
   parent patch (cold liquid, alamo blue) sits at lower left and sheds
   progressively smaller fragments up and to the right, which warm through
   yellow and orange and burn out as small red embers in the upper right.  Two
   thin outlined boxes are refinement patches tracking the fragments.
-->
<svg
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   width="344mm"
   height="82mm"
   viewBox="0 0 344 82"
   version="1.1"
   id="flames-logo">
  <defs id="defs2" />
  <g id="glyph">
    <!-- domain outline -->
    <rect style="fill:none;stroke:#1f77b4;stroke-width:1.659;stroke-linejoin:round"
          x="0.83" y="0.83" width="78.597" height="78.597" id="domain" />

    <!-- parent patch: block-structured decomposition of a single liquid body -->
    <g style="fill:#1f77b4;stroke:none" id="parent">
      <rect x="5"    y="57.26" width="18"   height="18"   />
      <rect x="24.2" y="66.86" width="12.8" height="8.4"  />
      <rect x="24.2" y="57.26" width="12.8" height="8.4"  />
      <rect x="5"    y="43.26" width="18"   height="12.8" />
      <rect x="24.2" y="43.26" width="12.8" height="12.8" />
    </g>

    <!-- refinement patches tracking the shed fragments -->
    <rect style="fill:none;stroke:#1f77b4;stroke-width:0.55"
          x="37.9" y="42.2" width="12.8" height="12.8" />
    <rect style="fill:none;stroke:#ef7215;stroke-width:0.55"
          x="45.6" y="22.2" width="14.9" height="11.6" />

    <!-- shed fragments: cold ... ignition ... burnout, travelling up and right -->
    <g id="fragments" style="stroke:none">
      <!-- still cold -->
      <rect x="40.0" y="44.3" width="9.0" height="9.0" style="fill:#1f77b4" />
      <rect x="51.0" y="40.0" width="7.4" height="7.4" style="fill:#3f92bd" />

      <!-- heating: bridges the blue fragments into the flame colours -->
      <rect x="43.5" y="35.4" width="6.6" height="6.6" style="fill:#f7c948" />
      <rect x="54.5" y="31.6" width="6.2" height="6.2" style="fill:#f5b70b" />

      <!-- burning -->
      <rect x="46.5" y="27.4" width="5.4" height="5.4" style="fill:#f59f0b" />
      <rect x="63.0" y="26.8" width="5.0" height="5.0" style="fill:#f59f0b" />
      <rect x="55.2" y="23.0" width="4.4" height="4.4" style="fill:#ef7215" />
      <rect x="69.5" y="21.6" width="4.0" height="4.0" style="fill:#ef7215" />
      <rect x="47.2" y="18.4" width="3.6" height="3.6" style="fill:#e14b17" />
      <rect x="61.2" y="17.6" width="3.2" height="3.2" style="fill:#e14b17" />

      <!-- burning out -->
      <rect x="52.8" y="14.8" width="2.8" height="2.8" style="fill:#cf2f1e" />
      <rect x="68.2" y="14.6" width="2.6" height="2.6" style="fill:#cf2f1e" />
      <rect x="58.8" y="11.4" width="2.3" height="2.3" style="fill:#cf2f1e" />
      <rect x="46.2" y="12.6" width="2.1" height="2.1" style="fill:#cf2f1e" />
      <rect x="74.0" y="10.4" width="2.0" height="2.0" style="fill:#b3211a" />
      <rect x="64.2" y="8.4"  width="1.8" height="1.8" style="fill:#b3211a" />
      <rect x="53.2" y="8.6"  width="1.6" height="1.6" style="fill:#b3211a" />
      <rect x="73.6" y="15.8" width="1.5" height="1.5" style="fill:#b3211a" />
      <rect x="70.0" y="6.2"  width="1.4" height="1.4" style="fill:#b3211a" />
      <rect x="59.2" y="5.6"  width="1.2" height="1.2" style="fill:#b3211a" />
      <rect x="71.2" y="19.8" width="1.2" height="1.2" style="fill:#b3211a" />
      <rect x="75.6" y="5.4"  width="1.1" height="1.1" style="fill:#b3211a" />
      <rect x="49.8" y="5.8"  width="1.0" height="1.0" style="fill:#b3211a" />
      <rect x="76.4" y="9.2"  width="1.0" height="1.0" style="fill:#b3211a" />
      <rect x="65.8" y="4.2"  width="0.9" height="0.9" style="fill:#b3211a" />
      <rect x="76.8" y="13.0" width="0.9" height="0.9" style="fill:#b3211a" />
      <rect x="72.4" y="3.4"  width="0.8" height="0.8" style="fill:#b3211a" />
      <rect x="62.2" y="2.6"  width="0.7" height="0.7" style="fill:#b3211a" />
    </g>
  </g>

  <text xml:space="preserve"
     style="font-weight:bold;font-size:72.8243px;font-family:'Open Sans';-inkscape-font-specification:'Open Sans Bold';letter-spacing:0px;word-spacing:0px;fill:#1f77b4;fill-opacity:1;stroke:none"
     x="92.38" y="55.36" id="wordmark"><tspan x="92.38" y="55.36">flames</tspan></text>

  <text xml:space="preserve"
     style="font-style:normal;font-weight:normal;font-size:13.5px;font-family:'Open Sans';-inkscape-font-specification:'Open Sans';letter-spacing:2px;word-spacing:0px;fill:#1f77b4;fill-opacity:1;stroke:none"
     x="93.98" y="78.25" id="subtitle"><tspan x="93.98" y="78.25">MULTIPHASE REACTING FLOW</tspan></text>
</svg>
